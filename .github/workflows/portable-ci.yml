name: Portable CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch, so a newer head cancels the older run.
  # Push runs get a group per commit: GitHub keeps only one pending run per
  # group, so a shared master group would still drop queued merge commits.
  group: portable-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on a pinned runner image (issue #227): ubuntu-latest moves to a
# new Ubuntu release without a change here.
jobs:
  scripts-and-ledger:
    name: Scripts and review ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check Bash syntax and help
        run: |
          bash tests/check_shell_syntax.sh
          ./build_mac.sh --help

      - name: Check PowerShell syntax and help
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($path in @("build_mac.ps1", "setup_retro68.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell parser rejected $path"
            }
          }
          ./build_mac.ps1 --help

      - name: Compile Python utilities
        run: |
          python -m py_compile \
            create_appledouble.py \
            generate_icon_r.py \
            macbinary_encode.py \
            ndif_image.py

      - name: Check prioritized issue ledger
        run: python -m unittest tests.test_review_ledger tests.test_renderer_build_manifests -v

  packaging-tools:
    name: Packaging tools (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The install image reproducibility test (issue #405) needs genisoimage.
      - name: Install genisoimage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends genisoimage

      - name: Run packaging utility regressions
        run: python -m unittest tests.test_packaging_tools -v

  host-c-regressions-shard:
    name: Host C regressions (${{ matrix.cc }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run host memory-safety regressions
        env:
          CC: ${{ matrix.cc }}
        run: bash tests/run_host_regressions.sh --shard ${{ matrix.shard }}/4 --deadline 1200

  host-c-regressions:
    name: Host C regressions (ASan/UBSan)
    if: always()
    needs: host-c-regressions-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.host-c-regressions-shard.result }}
        run: |
          echo "Shard matrix result: $SHARD_RESULT"
          test "$SHARD_RESULT" = success

  host-c-regressions-be32-shard:
    name: Host C regressions (ppc32 BE ${{ matrix.shard }}/4)
    # Pinned: the job depends on Ubuntu's cross/qemu package names and binfmt layout.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      QEMU_LD_PREFIX: /usr/powerpc-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the PowerPC cross compilers and qemu-user
        # This takes under a minute, but downloads from the Azure mirror stall.
        # Retrying that mirror stalls again, and apt's default timeouts move on
        # to the next one too slowly. So give up on a connection sooner, and
        # after a failed try leave the Azure mirror out.
        timeout-minutes: 10
        run: |
          packages="gcc-powerpc-linux-gnu g++-powerpc-linux-gnu libc6-dev-powerpc-cross qemu-user-static"
          apt_opts="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1"
          cat /etc/apt/apt-mirrors.txt || true
          installed=
          for try in 1 2 3; do
            if sudo timeout -k 10 180 bash -ec "
              dpkg --configure -a
              apt-get $apt_opts update -q
              apt-get $apt_opts install -y -q --no-install-recommends $packages
            "; then
              installed=1
              break
            fi
            echo "::warning::Package install try $try of 3 failed or timed out"
            sudo sed -i '/azure\.archive/d' /etc/apt/apt-mirrors.txt || true
            sleep 5
          done
          test -n "$installed"
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-ppc ]; then
            sudo systemctl restart systemd-binfmt
          fi

      - name: Check that sanitized 32-bit big-endian binaries run
        run: |
          cat > "$RUNNER_TEMP/be32-probe.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
              unsigned int one = 1;
              if (*(unsigned char *)&one != 0 || sizeof(long) != 4 || (char)-1 >= 0) return 1;
              puts("32-bit big-endian PowerPC with signed char");
              return 0;
          }
          EOF
          tests/be32_cc.sh -fsanitize=address,undefined "$RUNNER_TEMP/be32-probe.c" \
            -o "$RUNNER_TEMP/be32-probe"
          "$RUNNER_TEMP/be32-probe"
          # C++ too: run_mac_toolbox_init_tests.sh builds mac_consolehooks.cc.
          cat > "$RUNNER_TEMP/be32-probe.cc" <<'EOF'
          #include <string>
          int main() {
              std::string s("ppc32");
              return s.size() == 5 && sizeof(long) == 4 ? 0 : 1;
          }
          EOF
          tests/be32_cxx.sh -fsanitize=address,undefined "$RUNNER_TEMP/be32-probe.cc" \
            -o "$RUNNER_TEMP/be32-probe-cxx"
          "$RUNNER_TEMP/be32-probe-cxx"

      - name: Run 32-bit big-endian regressions
        env:
          CC: ${{ github.workspace }}/tests/be32_cc.sh
          Q3_TEST_DETECT_LEAKS: "0"
        run: >-
          bash tests/run_host_regressions.sh --shard ${{ matrix.shard }}/4
          --skip-file tests/be32_skip.txt --deadline 1200

  host-c-regressions-be32:
    name: Host C regressions (ppc32 BE)
    if: always()
    needs: host-c-regressions-be32-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.host-c-regressions-be32-shard.result }}
        run: |
          echo "Shard matrix result: $SHARD_RESULT"
          test "$SHARD_RESULT" = success
