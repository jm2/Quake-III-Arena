name: Portable CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-and-ledger:
    name: Scripts and review ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check Bash syntax and help
        run: |
          bash -n build_mac.sh setup_retro68.sh tests/run_host_c_tests.sh tests/run_vm_loading_tests.sh tests/run_vm_bytecode_tests.sh tests/run_vm_runtime_tests.sh tests/run_vm_call_tests.sh tests/run_vm_memory_trap_tests.sh tests/run_ui_syscall_tests.sh tests/run_cgame_syscall_tests.sh tests/run_server_core_syscall_tests.sh tests/run_vm_returned_string_tests.sh tests/run_botlib_navigation_tests.sh tests/run_botlib_chat_tests.sh tests/run_botlib_actions_tests.sh tests/run_botlib_ai_tests.sh tests/run_roq_stream_tests.sh tests/run_roq_frame_tests.sh tests/run_roq_vq_tests.sh tests/run_bmp_cursor_tests.sh tests/run_pcx_cursor_tests.sh tests/run_tga_cursor_tests.sh tests/run_jpeg_io_tests.sh tests/run_md3_layout_tests.sh tests/run_md4_layout_tests.sh tests/run_bsp_header_tests.sh tests/run_bsp_reference_tests.sh tests/run_bsp_lightmap_tests.sh tests/run_bsp_geometry_tests.sh tests/run_bsp_entity_grid_tests.sh tests/run_bsp_tree_tests.sh tests/run_bsp_model_capacity_tests.sh tests/run_bsp_trace_tests.sh tests/run_bsp_world_tests.sh tests/run_bsp_patch_grid_tests.sh tests/run_bsp_winding_tests.sh tests/run_hunk_allocation_tests.sh tests/run_bsp_lod_tests.sh tests/run_shader_stage_tests.sh tests/run_skin_capacity_tests.sh tests/run_font_layout_tests.sh tests/run_font_freetype_tests.sh tests/run_shader_archive_tests.sh tests/run_shader_runtime_tests.sh tests/run_sky_bounds_tests.sh tests/run_aas_layout_tests.sh tests/run_aas_endian_tests.sh tests/run_aas_writer_tests.sh tests/run_aas_geometry_tests.sh tests/run_bot_memory_tests.sh tests/run_aas_node_tests.sh tests/run_aas_reachability_tests.sh
          ./build_mac.sh --help

      - name: Check PowerShell syntax and help
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($path in @("build_mac.ps1", "setup_retro68.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell parser rejected $path"
            }
          }
          ./build_mac.ps1 --help

      - name: Compile Python utilities
        run: |
          python -m py_compile \
            create_appledouble.py \
            generate_icon_r.py \
            macbinary_encode.py

      - name: Check prioritized issue ledger
        run: python -m unittest tests.test_review_ledger tests.test_renderer_build_manifests -v

  packaging-tools:
    name: Packaging tools (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run packaging utility regressions
        run: python -m unittest tests.test_packaging_tools -v

  host-c-regressions:
    name: Host C regressions (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run host memory-safety checks
        run: |
          bash tests/run_host_c_tests.sh
          bash tests/run_vm_loading_tests.sh
          bash tests/run_vm_bytecode_tests.sh
          bash tests/run_vm_runtime_tests.sh
          bash tests/run_vm_call_tests.sh
          bash tests/run_vm_memory_trap_tests.sh
          bash tests/run_ui_syscall_tests.sh
          bash tests/run_cgame_syscall_tests.sh
          bash tests/run_server_core_syscall_tests.sh
          bash tests/run_vm_returned_string_tests.sh
          bash tests/run_botlib_navigation_tests.sh
          bash tests/run_botlib_chat_tests.sh
          bash tests/run_botlib_actions_tests.sh
          bash tests/run_botlib_ai_tests.sh
          bash tests/run_roq_stream_tests.sh
          bash tests/run_roq_frame_tests.sh
          bash tests/run_roq_vq_tests.sh
          bash tests/run_bmp_cursor_tests.sh
          bash tests/run_pcx_cursor_tests.sh
          bash tests/run_tga_cursor_tests.sh
          bash tests/run_jpeg_io_tests.sh
          bash tests/run_md3_layout_tests.sh
          bash tests/run_md4_layout_tests.sh
          bash tests/run_bsp_header_tests.sh
          bash tests/run_bsp_reference_tests.sh
          bash tests/run_bsp_lightmap_tests.sh
          bash tests/run_bsp_geometry_tests.sh
          bash tests/run_bsp_entity_grid_tests.sh
          bash tests/run_bsp_tree_tests.sh
          bash tests/run_bsp_model_capacity_tests.sh
          bash tests/run_bsp_trace_tests.sh
          bash tests/run_bsp_world_tests.sh
          bash tests/run_bsp_patch_grid_tests.sh
          bash tests/run_bsp_winding_tests.sh
          bash tests/run_hunk_allocation_tests.sh
          bash tests/run_bsp_lod_tests.sh
          bash tests/run_shader_stage_tests.sh
          bash tests/run_skin_capacity_tests.sh
          bash tests/run_font_layout_tests.sh
          bash tests/run_font_freetype_tests.sh
          bash tests/run_shader_archive_tests.sh
          bash tests/run_shader_runtime_tests.sh
          bash tests/run_sky_bounds_tests.sh
          bash tests/run_aas_layout_tests.sh
          bash tests/run_aas_endian_tests.sh
          bash tests/run_aas_writer_tests.sh
          bash tests/run_aas_geometry_tests.sh
          bash tests/run_bot_memory_tests.sh
          CC=clang bash tests/run_bot_memory_tests.sh
          bash tests/run_aas_node_tests.sh
          bash tests/run_aas_reachability_tests.sh
